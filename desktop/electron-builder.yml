# Packaging for the desktop app. The release workflow sets the version
# (-c.extraMetadata.version=...) and builds:
#   Windows: electron-builder --win nsis --x64     -> Anchor-Setup-<version>.exe
#   macOS:   electron-builder --mac dmg --universal -> Anchor-<version>-universal.dmg
# The installers keep the old names: installed builds look for them by name
# (src/updater.js) when they update themselves.
appId: io.github.alxndrjhn.anchor
productName: Anchor+
executableName: Anchor+
copyright: The Anchor and Anchor+ contributors, AGPL-3.0
directories:
  output: dist
files:
  - package.json
  - src/**/*
  # The web client built without a server (in web: pnpm build:local), which
  # keeps the notes on this computer until a server is set.
  - from: ../web/out
    to: web
  # The window and setup page icon.
  - from: ../web/public
    to: icons
    filter:
      - web-app-manifest-any-512x512.png
  # The setup page's fonts: the Android app's, so it looks like its first page.
  - from: ../mobile/assets/fonts
    to: fonts
    filter:
      - DMSans-Variable.ttf
      - PlayfairDisplay-Bold.ttf
      - OFL-DMSans.txt
      - OFL-PlayfairDisplay.txt
# electron-builder makes the .ico and .icns from this.
icon: ../web/public/icons/anchor_icon.png
asar: true
# Not electron-updater: src/updater.js updates from the GitHub releases.
publish: null

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: Anchor-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Anchor+
  uninstallDisplayName: Anchor+

mac:
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.productivity
  # Signed with the Developer ID certificate in CSC_LINK and notarized with
  # the App Store Connect key in APPLE_API_KEY*, which the release workflow
  # sets from its secrets. Hardened runtime, with electron-builder's default
  # entitlements for Electron. Without a certificate (a local build, or a
  # release before the secrets are set) build it ad-hoc signed instead, as
  # `pnpm run dist:mac` does: -c.mac.identity=- -c.mac.hardenedRuntime=false
  # -c.mac.notarize=false. It then runs once allowed (right-click > Open, or
  # Privacy & Security).
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
dmg:
  artifactName: Anchor-${version}-${arch}.${ext}

linux:
  target: dir
  executableName: anchor
  category: Office
