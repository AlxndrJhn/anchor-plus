name: Docker Build

on:
  workflow_call:
    inputs:
      push:
        description: Whether to push the image to the registry
        required: true
        type: boolean
      tags:
        description: Docker metadata tags configuration
        required: true
        type: string
      build-args:
        description: Docker build arguments, one NAME=value per line
        required: false
        type: string
        default: ""

# Each job asks for the writes it needs.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ inputs.tags }}

      # Changes daily, so the image's `apk upgrade` layer is rebuilt rather
      # than reused from the build cache, and takes Alpine's latest fixes.
      - name: Pick the day for a fresh apk upgrade
        id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APK_UPGRADE_DAY=${{ steps.day.outputs.date }}
            ${{ inputs.build-args }}
          load: true
          tags: anchor:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Test image
        run: sh docker/test-image.sh anchor:test

      # Fails on a high or critical vulnerability that has a fix.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: anchor:test
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Set image name
        if: inputs.push
        run: echo "IMAGE=$REGISTRY/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Push image by digest
        id: build
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APK_UPGRADE_DAY=${{ steps.day.outputs.date }}
            ${{ inputs.build-args }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: inputs.push
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For signing the image: a Sigstore certificate for this workflow
      # (id-token), and storing the build attestation with the repository.
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ inputs.tags }}

      - name: Create multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          IMAGE="$REGISTRY/${IMAGE_NAME,,}"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Look up the image digest
        id: digest
        run: |
          IMAGE="$REGISTRY/${IMAGE_NAME,,}"
          TAG=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Keyless: signed with a short-lived Sigstore certificate naming this
      # workflow, and logged in Rekor. Check with
      #   cosign verify ghcr.io/alxndrjhn/anchor-plus:<tag>       #     --certificate-identity-regexp '^https://github.com/AlxndrJhn/anchor-plus/'       #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Set up cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image
        env:
          REF: ${{ steps.digest.outputs.image }}@${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "$REF"

      # A signed record that this image was built by this workflow from this
      # commit, stored next to it in the registry:
      #   gh attestation verify oci://ghcr.io/alxndrjhn/anchor-plus:<tag> --repo AlxndrJhn/anchor-plus
      - name: Attest the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.digest.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
