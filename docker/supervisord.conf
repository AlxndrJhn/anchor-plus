[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
loglevel=warn

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; The server: the API, and the web app's pages from WEB_DIR (see the Dockerfile).
[program:api]
command=/usr/local/bin/node /app/server/dist/src/main
directory=/app/server
priority=20
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=1
startsecs=5
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="3000",DATABASE_URL="%(ENV_DATABASE_URL)s",JWT_SECRET="%(ENV_JWT_SECRET)s",NODE_ENV="production",OIDC_ENABLED="%(ENV_OIDC_ENABLED)s",OIDC_PROVIDER_NAME="%(ENV_OIDC_PROVIDER_NAME)s",OIDC_ISSUER_URL="%(ENV_OIDC_ISSUER_URL)s",OIDC_CLIENT_ID="%(ENV_OIDC_CLIENT_ID)s",OIDC_CLIENT_SECRET="%(ENV_OIDC_CLIENT_SECRET)s",OIDC_MOBILE_CLIENT_ID="%(ENV_OIDC_MOBILE_CLIENT_ID)s",DISABLE_INTERNAL_AUTH="%(ENV_DISABLE_INTERNAL_AUTH)s",APP_URL="%(ENV_APP_URL)s"

