packages:
  - .

allowBuilds:
  prisma: true
  '@prisma/engines': true
  bcrypt: true
  '@nestjs/core': false
  cpu-features: false
  protobufjs: false
  ssh2: false
  '@swc/core': false
  tesseract.js: false

# Patched versions of transitive dependencies whose parents pin a vulnerable
# one (pnpm audit runs in CI). Drop an entry once its parent catches up.
overrides:
  # @nestjs/platform-express pins 2.2.0
  multer: ^2.5.0
  # prisma pins these
  mysql2: ^3.22.0
  deepmerge-ts: ^8.0.0
  fast-uri: ^3.1.7
  source-map-js: ^1.2.2
  effect: ^3.22.1
  # @modelcontextprotocol/node allows 2.1.5
  '@hono/node-server': ^2.1.6
  # glob 10 (via archiver) pins minimatch 9
  'minimatch@>=7 <11.0.1': ^11.0.1
